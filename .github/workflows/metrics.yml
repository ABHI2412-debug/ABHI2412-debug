name: Generate Profile Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '.github/scripts/generate-profile.js'
      - '.github/workflows/metrics.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate animated dashboard SVG
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GITHUB_USER: ABHI2412-debug
        run: node .github/scripts/generate-profile.js

      - name: Commit updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/assets/profile.svg
          git diff --cached --quiet || (git commit -m "chore: refresh profile dashboard" && git push)
