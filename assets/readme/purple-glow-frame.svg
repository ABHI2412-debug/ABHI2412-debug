<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 80" width="100%" height="80" fill="none">
  <defs>
    <filter id="borderBloom" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="sharp" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="mid" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="diffuse" />
      <feMerge>
        <feMergeNode in="diffuse" />
        <feMergeNode in="mid" />
        <feMergeNode in="sharp" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.7" />
      <stop offset="25%" stop-color="#c084fc" stop-opacity="1" />
      <stop offset="50%" stop-color="#9333ea" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#c084fc" stop-opacity="1" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.7" />
    </linearGradient>
    <radialGradient id="cornerAuraTL" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#581c87" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cornerAuraBR" cx="100%" cy="100%" r="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#581c87" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    @keyframes frameBreath {
      0%, 100% {
        opacity: 0.12;
        transform: scale(0.995);
      }
      50% {
        opacity: 0.95;
        transform: scale(1.002);
      }
    }
    .glowing-box {
      transform-origin: center;
      animation: frameBreath 3.6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
  <g class="glowing-box">
    <!-- Corner atmospheric glows -->
    <rect x="8" y="8" width="160" height="64" rx="14" fill="url(#cornerAuraTL)" filter="url(#borderBloom)" />
    <rect x="832" y="8" width="160" height="64" rx="14" fill="url(#cornerAuraBR)" filter="url(#borderBloom)" />

    <!-- Pulsing Neon Perimeter Frame -->
    <rect x="8" y="8" width="984" height="64" rx="14" stroke="url(#neonGradient)" stroke-width="2" fill="none" filter="url(#borderBloom)" />
    
    <!-- Delicate Corner Tech Accents -->
    <circle cx="20" cy="20" r="2.5" fill="#f3e8ff" />
    <circle cx="980" cy="20" r="2.5" fill="#f3e8ff" />
    <circle cx="20" cy="60" r="2.5" fill="#f3e8ff" />
    <circle cx="980" cy="60" r="2.5" fill="#f3e8ff" />
  </g>
</svg>
